<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RESPONS – Kommer snart</title>

  <meta
    name="description"
    content="Bøker som skaper en respons. Spørsmål verdt å svare på. Historier verdt å ta vare på."
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Montserrat:wght@300;400&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #f7f2eb;
      color: #4b3326;
      font-family: "Montserrat", Arial, sans-serif;
    }

    a {
      color: inherit;
    }

    .page {
      min-height: 100vh;
      padding: 38px 4vw 36px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 42px;
    }

    .brand {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 31px;
      font-weight: 400;
      letter-spacing: 10px;
      text-transform: uppercase;
    }

    .header-links {
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .icon-link {
      width: 27px;
      height: 27px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: opacity 0.2s ease;
    }

    .icon-link:hover {
      opacity: 0.55;
    }

    .icon-link svg {
      width: 23px;
      height: 23px;
    }

    .menu {
      width: 28px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      cursor: default;
    }

    .menu span {
      width: 100%;
      height: 1px;
      background: #4b3326;
    }

    .hero {
      min-height: calc(100vh - 130px);
      display: grid;
      grid-template-columns: 40% 60%;
      align-items: stretch;
    }

    .hero-copy {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 55px 6vw 55px 1vw;
    }

    .hero-copy h1 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(70px, 6.2vw, 115px);
      line-height: 0.94;
      font-weight: 300;
      letter-spacing: -2px;
      max-width: 600px;
    }

    .description {
      margin-top: 58px;
      font-family: "Montserrat", Arial, sans-serif;
      font-size: clamp(18px, 1.25vw, 24px);
      line-height: 1.55;
      font-weight: 300;
      max-width: 520px;
    }

    .cta {
      margin-top: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: fit-content;
      min-width: 280px;
      padding: 21px 34px;
      background: #29442d;
      color: #fff;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 5px;
      font-size: 14px;
      transition:
        transform 0.2s ease,
        opacity 0.2s ease;
    }

    .cta:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    .social-bottom {
      margin-top: auto;
      padding-top: 65px;
      font-family: "Montserrat", Arial, sans-serif;
      font-size: 15px;
      line-height: 1.9;
      font-weight: 300;
    }

    .social-bottom a {
      text-decoration: none;
    }

    .social-bottom a:hover {
      text-decoration: underline;
    }

    .dot {
      padding: 0 11px;
    }

    .hero-image {
      min-height: 760px;
      overflow: hidden;
      background: #e8ddce;
    }

    .hero-image img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
    }

    @media (max-width: 900px) {
      .page {
        padding: 28px 20px 35px;
      }

      .header {
        margin-bottom: 30px;
      }

      .brand {
        font-size: 24px;
        letter-spacing: 7px;
      }

      .header-links {
        gap: 16px;
      }

      .hero {
        min-height: auto;
        display: flex;
        flex-direction: column;
      }

      .hero-copy {
        padding: 45px 4px 45px;
      }

      .hero-copy h1 {
        font-size: clamp(63px, 17vw, 92px);
        max-width: 100%;
      }

      .description {
        margin-top: 38px;
        font-size: 18px;
      }

      .cta {
        margin-top: 32px;
        min-width: 0;
        width: 100%;
        max-width: 310px;
      }

      .social-bottom {
        margin-top: 45px;
        padding-top: 0;
      }

      .hero-image {
        min-height: 0;
        aspect-ratio: 1 / 1.1;
      }
    }

    @media (max-width: 480px) {
      .page {
        padding: 23px 17px 25px;
      }

      .brand {
        font-size: 20px;
        letter-spacing: 6px;
      }

      .hero-copy {
        padding-top: 34px;
      }

      .hero-copy h1 {
        font-size: 64px;
        line-height: 0.95;
      }

      .description {
        font-size: 16px;
      }

      .cta {
        font-size: 12px;
        letter-spacing: 4px;
      }

      .social-bottom {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <header class="header">

      <div class="brand">
        RESPONS
      </div>

      <div class="header-links">

        <a
          class="icon-link"
          href="https://www.instagram.com/byrespons/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Instagram"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="3" width="18" height="18" rx="5"></rect>
            <circle cx="12" cy="12" r="4"></circle>
            <circle cx="17.3" cy="6.7" r="1" fill="currentColor" stroke="none"></circle>
          </svg>
        </a>

        <a
          class="icon-link"
          href="https://www.tiktok.com/@byrespons"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="TikTok"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M14 4v10.1a4.1 4.1 0 1 1-3.2-4"></path>
            <path d="M14 4c.7 2.3 2.4 3.7 5 4"></path>
          </svg>
        </a>

        <div class="menu" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </div>

      </div>

    </header>


    <main class="hero">

      <section class="hero-copy">

        <h1>
          bøker som<br>
          skaper en<br>
          respons.
        </h1>

        <div class="description">
          <p>Spørsmål verdt å svare på.</p>
          <p>Historier verdt å ta vare på.</p>
          <p>Responsen blir til bøker.</p>
        </div>

        <a
          class="cta"
          href="https://www.instagram.com/byrespons/"
          target="_blank"
          rel="noopener noreferrer"
        >
          Kommer snart
        </a>

        <div class="social-bottom">

          <div>
            <a
              href="https://www.instagram.com/byrespons/"
              target="_blank"
              rel="noopener noreferrer"
            >
              Instagram
            </a>

            <span class="dot">·</span>

            <a
              href="https://www.tiktok.com/@byrespons"
              target="_blank"
              rel="noopener noreferrer"
            >
              TikTok
            </a>
          </div>

          <div>
            byrespons.no
          </div>

        </div>

      </section>


      <section class="hero-image">

        <img
          src="Bok%200.png"
          alt="Deg, gjennom våre øyne – Bok 0"
        >

      </section>

    </main>

  </div>

</body>
</html>
