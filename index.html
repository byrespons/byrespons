<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RESPONS</title>
  <style>
    body {
      margin: 0;
      font-family: Georgia, serif;
      background: #f8f5ee;
      color: #4b3a2f;
      text-align: center;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    h1 {
      font-size: 64px;
      letter-spacing: 12px;
      margin: 0 0 20px;
      font-weight: normal;
    }

    .tagline {
      font-size: 22px;
      font-style: italic;
      margin-bottom: 40px;
    }

    .story {
      max-width: 650px;
      font-size: 24px;
      line-height: 1.6;
      margin-bottom: 40px;
    }

    .coming {
      font-size: 14px;
      letter-spacing: 4px;
      text-transform: uppercase;
      border-top: 1px solid #9aa58a;
      padding-top: 20px;
    }
  </style>
</head>

<body>
  <section class="hero">
    <h1>RESPONS</h1>

    <div class="tagline">
      Create something worth remembering.
    </div>

    <div class="story">
      Fordi en historie ikke slutter når den blir fortalt.<br>
      Den fortsetter i mennesket som mottar den.
    </div>

    <div class="coming">
      byrespons.no · kommer snart
    </div>
  </section>
</body>
</html>
