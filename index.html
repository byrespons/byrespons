<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RESPONS – Kommer snart</title>

  <meta
    name="description"
    content="RESPONS – Create something worth remembering. Kommer snart."
  >

  <!-- Elegante fonter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Montserrat:wght@300;400&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #f3e6d4;
      color: #493427;
    }

    .page {
      position: relative;

      width: 100%;
      min-height: 100vh;
      min-height: 100svh;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      padding: 55px 30px 80px;

      background-image: url("Bakgrunn%20nettside.png");
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
    }

    /* Svært svakt varmt filter */
    .page::before {
      content: "";

      position: absolute;
      inset: 0;

      background: rgba(246, 231, 211, 0.025);

      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 2;

      width: 100%;
      max-width: 1050px;

      text-align: center;

      transform: translateY(-10px);
    }


    /* RESPONS */

    .logo {
      font-family: "Cormorant Garamond", Georgia, serif;

      font-size: clamp(100px, 10vw, 170px);

      font-weight: 300;

      line-height: 0.75;

      letter-spacing: 3px;

      color: #493427;

      text-transform: lowercase;
    }


    /* CREATE SOMETHING... */

    .tagline {
      margin-top: 54px;

      font-family: "Cormorant Garamond", Georgia, serif;

      font-size: clamp(26px, 2.4vw, 39px);

      font-weight: 400;

      font-style: italic;

      letter-spacing: 1.5px;

      line-height: 1.2;

      color: #493427;
    }


    /* NORSK TEKST */

    .story {
      max-width: 950px;

      margin: 75px auto 0;

      font-family: "Cormorant Garamond", Georgia, serif;

      font-size: clamp(27px, 2.5vw, 42px);

      font-weight: 300;

      letter-spacing: 0.5px;

      line-height: 1.35;

      color: #493427;
    }


    /* LINJE */

    .line {
      width: min(500px, 65%);

      height: 1px;

      margin: 67px auto 32px;

      background-color: rgba(101, 122, 74, 0.75);
    }


    /* BYRESPONS.NO */

    .coming-soon {
      font-family: "Cormorant Garamond", Georgia, serif;

      font-size: clamp(15px, 1.35vw, 21px);

      font-weight: 400;

      letter-spacing: 7px;

      text-transform: uppercase;

      color: #493427;
    }


    /* SOSIALE MEDIER */

    .socials {
      margin-top: 39px;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 26px;

      flex-wrap: wrap;
    }

    .social-link {
      display: inline-flex;
      align-items: center;

      gap: 11px;

      color: #493427;

      text-decoration: none;

      font-family: "Montserrat", Arial, sans-serif;

      font-size: 11px;

      font-weight: 300;

      letter-spacing: 3.5px;

      text-transform: uppercase;

      transition:
        opacity 0.25s ease,
        transform 0.25s ease;
    }

    .social-link:hover {
      opacity: 0.55;
      transform: translateY(-2px);
    }

    .social-divider {
      font-family: "Montserrat", Arial, sans-serif;

      font-size: 15px;

      font-weight: 300;

      opacity: 0.45;
    }


    /* INSTAGRAM */

    .instagram-icon {
      width: 23px;
      height: 23px;
    }


    /* TIKTOK */

    .tiktok-icon {
      width: 22px;
      height: 22px;

      display: inline-flex;
      align-items: center;
      justify-content: center;
    }


    /* FOOTER */

    .footer {
      position: absolute;

      bottom: 26px;
      left: 0;

      width: 100%;

      z-index: 2;

      text-align: center;

      font-family: "Montserrat", Arial, sans-serif;

      font-size: 9px;

      font-weight: 300;

      letter-spacing: 5px;

      text-transform: uppercase;

      color: #493427;

      opacity: 0.7;
    }


    /* MOBIL */

    @media (max-width: 700px) {

      .page {
        min-height: 100svh;

        padding:
          max(50px, env(safe-area-inset-top))
          22px
          90px;

        background-position: center center;
      }

      .content {
        transform: translateY(-5px);
      }

      .logo {
        font-size: clamp(78px, 25vw, 110px);

        line-height: 0.85;

        letter-spacing: 1px;
      }

      .tagline {
        margin-top: 35px;

        font-size: clamp(22px, 6vw, 27px);

        line-height: 1.25;
      }

      .story {
        margin-top: 57px;

        max-width: 500px;

        font-size: clamp(21px, 5.7vw, 27px);

        line-height: 1.4;
      }

      .story br {
        display: none;
      }

      .line {
        width: 68%;

        margin-top: 55px;
        margin-bottom: 29px;
      }

      .coming-soon {
        font-size: 12px;

        letter-spacing: 4px;

        line-height: 1.6;
      }

      .socials {
        margin-top: 33px;

        gap: 18px;
      }

      .social-link {
        font-size: 9px;

        letter-spacing: 2.5px;
      }

      .instagram-icon,
      .tiktok-icon {
        width: 19px;
        height: 19px;
      }

      .footer {
        bottom: 18px;

        font-size: 8px;

        letter-spacing: 3px;
      }
    }


    /* VELDIG SMÅ MOBILER */

    @media (max-width: 390px) {

      .logo {
        font-size: 76px;
      }

      .tagline {
        font-size: 21px;
      }

      .story {
        font-size: 20px;
      }

      .socials {
        gap: 14px;
      }

      .social-divider {
        display: none;
      }

    }

  </style>
</head>


<body>

  <main class="page">

    <section class="content">

      <h1 class="logo">
        respons
      </h1>

      <p class="tagline">
        Create something worth remembering.
      </p>

      <p class="story">
        Fordi en historie ikke slutter når den blir fortalt.<br>
        Den fortsetter i mennesket som mottar den.
      </p>

      <div class="line"></div>

      <p class="coming-soon">
        byrespons.no · kommer snart
      </p>


      <div class="socials">

        <!-- INSTAGRAM -->

        <a
          class="social-link"
          href="https://www.instagram.com/byrespons/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="RESPONS på Instagram"
        >

          <svg
            class="instagram-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >

            <rect
              x="3"
              y="3"
              width="18"
              height="18"
              rx="5"
            ></rect>

            <circle
              cx="12"
              cy="12"
              r="4"
            ></circle>

            <circle
              cx="17.4"
              cy="6.6"
              r="0.9"
              fill="currentColor"
              stroke="none"
            ></circle>

          </svg>

          <span>Instagram</span>

        </a>


        <span class="social-divider">
          |
        </span>


        <!-- TIKTOK -->

        <a
          class="social-link"
          href="https://www.tiktok.com/@byrespons"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="RESPONS på TikTok"
        >

          <svg
            class="tiktok-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
          >

            <path d="M14 4v10.2a4.2 4.2 0 1 1-3.3-4.1"></path>

            <path d="M14 4c.7 2.4 2.3 3.8 5 4"></path>

          </svg>

          <span>TikTok</span>

        </a>

      </div>

    </section>


    <footer class="footer">
      © 2026 RESPONS
    </footer>

  </main>

</body>
</html>
