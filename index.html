<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>respons</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      background: #f8f5ee;
      color: #4b3a2f;
      text-align: center;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 48px 20px;
    }

    /* LOGO */
    .logo {
      margin: 0 0 24px;
      font-family: Baskerville, "Baskerville Old Face", "Times New Roman", serif;
      font-size: clamp(68px, 8vw, 94px);
      line-height: 1;
      font-weight: 400;
      letter-spacing: 0.02em;
    }

    /* CREATE SOMETHING... */
    .tagline {
      margin-bottom: 40px;
      font-size: clamp(19px, 2vw, 24px);
      line-height: 1.4;
      font-style: italic;
    }

    /* HOVEDTEKST */
    .story {
      max-width: 680px;
      margin-bottom: 42px;
      font-size: clamp(21px, 2.3vw, 27px);
      line-height: 1.55;
    }

    /* KOMMER SNART */
    .coming {
      width: min(345px, 70vw);
      border-top: 1px solid #9aa58a;
      padding-top: 20px;
      font-size: 13px;
      line-height: 1.6;
      letter-spacing: 0.25em;
      text-transform: uppercase;
    }

    /* MOBIL */
    @media (max-width: 600px) {
      .hero {
        padding: 36px 22px;
      }

      .logo {
        margin-bottom: 20px;
      }

      .tagline {
        margin-bottom: 32px;
      }

      .story {
        margin-bottom: 36px;
      }

      .coming {
        font-size: 11px;
        letter-spacing: 0.18em;
      }
    }
  </style>
</head>

<body>

  <main class="hero">

    <h1 class="logo">respons</h1>

    <div class="tagline">
      Create something worth remembering.
    </div>

    <div class="story">
      Fordi en historie ikke slutter når den blir fortalt.<br />
      Den fortsetter i mennesket som mottar den.
    </div>

    <div class="coming">
      byrespons.no · kommer snart
    </div>

  </main>

</body>
</html>
